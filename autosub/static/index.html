<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightsub</title>
<style>
  :root { --bg: #f4f6fb; --fg: #1f2937; --muted: #667085; --line: #d9e0eb; --card: #fff; --subtle: #f8fafc; --acc: #356fe5; --bad: #c73939; --ok: #17824b; --shadow: 0 2px 10px #172b4d0d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --card: #18212f; --subtle: #111927; --acc: #78a6ff; --bad: #ff8980; --ok: #62d795; --shadow: 0 2px 12px #0004; } }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  main { max-width: 1180px; margin: auto; }
  h1 { margin: 0 0 1rem; font-size: 1.55rem; letter-spacing: -.02em; }
  h2 { font-size: 1rem; margin: 0 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; flex: 1; min-width: 16rem; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  #browser { max-height: 16rem; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin: .6rem 0; }
  #browser div { padding: .25rem .6rem; cursor: pointer; border-bottom: 1px solid var(--line); }
  #browser div:hover { background: var(--bg); }
  .chips span { display: inline-flex; gap: .3rem; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: .1rem .5rem; margin: .15rem; }
  .chips button { border: 0; padding: 0 .2rem; background: none; }
  table { border-collapse: collapse; width: 100%; }
  table[aria-label="Hàng đợi phụ đề"], table[aria-label="Hàng đợi phụ đề"] tbody { display: block; }
  table[aria-label="Hàng đợi phụ đề"] thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); }
  .bar { width: 8rem; height: .5rem; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  td.video { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  button, summary { min-height: 44px; }
  button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  .queue-card { display: grid; grid-template-columns: minmax(10rem, 1fr) auto minmax(0, 3.5fr) auto auto; gap: .8rem; align-items: center; margin: .65rem 0; padding: .85rem; border: 1px solid var(--line); border-radius: 10px; background: var(--subtle); }
  .queue-card > td { min-width: 0; padding: 0; border: 0; }
  .queue-card .job-id { display: none; }
  .job-video { display: flex; align-items: center; gap: .5rem; min-width: 0; font-weight: 700; }
  .job-video .video { display: block; min-width: 0; }
  .lang-cell, .result-cell { font-size: .84rem; }
  .lang-tag { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .48rem; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
  .cloud-icon { color: var(--acc); cursor: help; font-size: 1rem; }
  .steps-cell { min-width: 0; width: 100%; }
  .steps-viewport { width: 100%; max-width: 100%; }
  .step-strip { display: flex; width: 100%; min-width: 0; list-style: none; margin: 0; padding: .1rem 0; }
  .step-item { position: relative; flex: 1 1 0; min-width: 0; text-align: center; color: var(--muted); }
  .step-item::after { content: ""; position: absolute; z-index: 0; top: 1rem; left: calc(50% + 1rem); width: calc(100% - 2rem); height: 2px; background: var(--line); }
  .step-item:last-child::after { display: none; }
  .step-item.is-complete::after { background: var(--ok); }
  .step-head { position: relative; z-index: 1; display: flex; justify-content: center; }
  .step-icon { display: grid; width: 2rem; height: 2rem; place-items: center; border: 2px solid var(--line); border-radius: 50%; color: var(--muted); background: var(--bg); font-size: .85rem; font-weight: 700; }
  .step-item.is-complete .step-icon { border-color: var(--ok); color: var(--bg); background: var(--ok); }
  .step-item.is-current .step-icon { border-color: var(--acc); color: var(--bg); background: var(--acc); }
  .step-item.is-failed .step-icon { border-color: var(--bad); color: var(--bg); background: var(--bad); }
  .step-item.is-current .step-label { color: var(--acc); font-weight: 700; }
  .step-item.is-failed, .step-item.is-failed .step-label { color: var(--bad); }
  .step-label { display: block; margin: .25rem .1rem 0; font-size: .68rem; line-height: 1.2; }
  .step-meta { display: block; margin-top: .1rem; font-size: .65rem; white-space: nowrap; }
  .step-item.is-complete .step-meta { color: var(--ok); }
  .step-item.is-failed .step-meta { color: var(--bad); }
  .step-progress { display: block; height: .25rem; max-width: 5rem; margin: .25rem auto 0; background: var(--line); border-radius: 99px; overflow: hidden; }
  .step-progress i { display: block; height: 100%; background: var(--acc); }
  .step-item.is-failed .step-progress i { background: var(--bad); }
  .step-preview { margin-top: .65rem; padding: .6rem; border: 1px solid var(--line); border-radius: 6px; }
  #stepLegend { margin-top: .7rem; }
  #stepLegend summary { cursor: pointer; }
  #stepLegend ul { margin: .35rem 0 0; padding-left: 1.2rem; }
  #viewer[hidden] { display: none; }
  .viewer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; }
  .brief { border: 1px solid var(--line); border-radius: 8px; padding: .65rem .75rem; margin: .6rem 0; background: var(--subtle); max-width: 70rem; }
  .brief p { margin: .2rem 0; }
  .brief-addresses { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
  .brief-address { padding: .15rem .42rem; border: 1px solid var(--line); border-radius: 6px; font-size: .78rem; }
  .table-scroll { overflow: auto; max-height: min(65vh, 44rem); border: 1px solid var(--line); border-radius: 8px; }
  table.vlines { min-width: 700px; }
  table.vlines th { position: sticky; top: 0; z-index: 1; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  table.vlines td { vertical-align: top; overflow-wrap: anywhere; line-height: 1.55; }
  table.vlines td:nth-child(3) { color: var(--muted); font-family: ui-monospace, "Noto Sans JP", monospace; }
  table.vlines td:nth-child(4) { font-weight: 550; }
  .speaker-chip { display: inline-flex; max-width: 10rem; align-items: center; border: 1px solid currentColor; border-radius: 99px; padding: .1rem .45rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .78rem; font-weight: 650; }
  .badge { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: .05rem .4rem; margin: .1rem; white-space: nowrap; font-size: .75rem; }
  .badge.polished { color: var(--ok); border-color: var(--ok); }
  .badge.failed { color: var(--bad); border-color: var(--bad); }
  .job-error { grid-column: 1 / -1; margin: -.1rem 0 0; color: var(--bad); }
  .job-error summary { display: block; min-height: 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-error p { margin: .35rem 0 0; overflow-wrap: anywhere; }
  @media (max-width: 760px) {
    body { padding: .75rem; }
    .queue-card { grid-template-columns: minmax(0, 1fr) auto; gap: .55rem; }
    .job-video { grid-column: 1 / -1; }
    .steps-cell { grid-column: 1 / -1; }
    .steps-viewport { overflow: visible; }
    .step-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .65rem .2rem; }
    .step-item::after { display: none; }
    .result-cell { grid-column: 1; }
    .queue-card .actions { grid-column: 1 / -1; }
    .actions { gap: .5rem; }
  }
  @media (max-width: 420px) {
    body { padding: .55rem; font-size: 13px; }
    .card { padding: .75rem; border-radius: 10px; }
    #dir { flex: 1 0 100%; min-width: 0; width: 100%; order: -1; }
    .queue-card { padding: .7rem; }
    .viewer-head { flex-direction: column; }
    .viewer-head > button { align-self: flex-end; margin-top: -.25rem; }
    .table-scroll { max-height: 58vh; }
  }
</style>
</head>
<body>
<main>
<h1>nightsub</h1>

<div class="card" id="doctor"><span class="muted">Đang kiểm tra hệ thống…</span></div>

<div class="card">
  <h2>Thêm video</h2>
  <div class="row">
    <button id="up" title="Thư mục cha">↑</button>
    <input type="text" id="dir" aria-label="Thư mục">
    <button id="go">Mở</button>
    <button id="addDir">Chọn cả thư mục này</button>
  </div>
  <div id="browser"></div>
  <div class="chips" id="picked"><span class="muted">Chưa chọn video nào. Bấm vào video ở trên để chọn.</span></div>
  <div class="row" style="margin-top:.6rem">
    <label><input type="checkbox" name="lang" value="en" checked> Tiếng Anh</label>
    <label><input type="checkbox" name="lang" value="vi" checked> Tiếng Việt</label>
    <label title="Hiện [rên], [nhạc]… ở các đoạn không có lời thoại"><input type="checkbox" id="tags"> Ghi chú âm thanh</label>
    <button class="primary" id="add" disabled>Bắt đầu</button>
    <span id="msg" role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
  <details id="stepLegend">
    <summary>Các bước xử lý</summary>
    <div id="stepPreview" class="step-preview" aria-label="Ví dụ: bước 3 đang chạy"><span class="muted">Đang tải xem trước…</span></div>
    <ul id="stepHelp"><li class="muted">Đang tải các bước…</li></ul>
  </details>
</div>

<div class="card">
  <h2>Hàng đợi</h2>
  <table aria-label="Hàng đợi phụ đề">
    <thead><tr><th>#</th><th>Video</th><th>Ngôn ngữ</th><th>Các bước</th><th>Kết quả</th><th>Thao tác</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="muted">Chưa có job nào.</td></tr></tbody>
  </table>
</div>

<section class="card" id="viewer" hidden aria-labelledby="viewerTitle">
  <div class="viewer-head">
    <div><h2 id="viewerTitle">Xem phụ đề</h2><div id="brief" class="brief"></div></div>
    <button id="closeViewer" aria-label="Đóng trình xem phụ đề">Đóng</button>
  </div>
  <label><input type="checkbox" id="lineFilter"> Chỉ dòng lỗi/đã chỉnh</label>
  <div class="table-scroll">
    <table class="vlines">
      <thead><tr><th>Thời gian</th><th>Giọng</th><th>日本語</th><th id="translationLabel">Bản dịch</th><th>Trạng thái</th></tr></thead>
      <tbody id="lineRows"></tbody>
    </table>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base = p => p.split("/").pop();
const fmt = s => s == null ? "—" : s < 60 ? "<1 phút" : `${Math.floor(s / 3600) ? Math.floor(s / 3600) + " giờ " : ""}${Math.floor(s / 60) % 60} phút`;
const fmtDuration = s => s == null ? "—" : s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
const LANG = {en: "Anh", vi: "Việt"};
const picked = new Set();
let stepInfo = [], viewerRows = [], activeViewer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function doctor() {
  try {
    const {problems} = await api("/doctor");
    $("doctor").innerHTML = problems.length
      ? `<b class="bad">Chưa sẵn sàng:</b><ul>${problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`
      : `<span class="ok">✓ Hệ thống sẵn sàng (GPU, ffmpeg, ollama, model)</span>`;
  } catch (e) { $("doctor").innerHTML = `<span class="bad">Không kiểm tra được: ${esc(e.message)}</span>`; }
}

async function loadSteps() {
  try {
    stepInfo = await api("/steps");
    $("stepHelp").innerHTML = stepInfo.map(s => `<li><b>${esc(s.label_vi)}</b>: ${esc(s.help_vi)}</li>`).join("");
    const previewSteps = stepInfo.map((step, i) => ({name: step.name, secs: i < 2 ? 8 + i * 3 : i === 2 ? 19 : null,
      progress: i === 2 ? 0.46 : undefined}));
    $("stepPreview").innerHTML = renderSteps(2, previewSteps, false);
  } catch (e) { $("stepHelp").innerHTML = `<li class="bad">Không tải được danh sách bước: ${esc(e.message)}</li>`; }
}

let cur = null;
async function browse(dir) {
  try {
    const b = await api(`/browse${dir ? "?dir=" + encodeURIComponent(dir) : ""}`);
    cur = b; $("dir").value = b.dir;
    $("browser").innerHTML = [
      ...b.dirs.map(d => `<div data-dir="${esc(d)}">📁 ${esc(d)}</div>`),
      ...b.videos.map(v => `<div data-video="${esc(v)}">${picked.has(b.dir + "/" + v) ? "☑" : "☐"} 🎬 ${esc(v)}</div>`),
    ].join("") || `<div class="muted">Thư mục trống</div>`;
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
$("browser").onclick = e => {
  const el = e.target.closest("div"); if (!el) return;
  if (el.dataset.dir) return browse(cur.dir + "/" + el.dataset.dir);
  if (el.dataset.video) { const p = cur.dir + "/" + el.dataset.video; picked.has(p) ? picked.delete(p) : picked.add(p); renderPicked(); browse(cur.dir); }
};
$("up").onclick = () => browse(cur.parent);
$("go").onclick = () => browse($("dir").value);
$("dir").onkeydown = e => { if (e.key === "Enter") browse($("dir").value); };
$("addDir").onclick = () => { picked.add(cur.dir); renderPicked(); };

function renderPicked() {
  $("picked").innerHTML = picked.size
    ? [...picked].map(p => `<span>${esc(base(p) || p)}<button data-p="${esc(p)}" title="Bỏ chọn">✕</button></span>`).join("")
    : `<span class="muted">Chưa chọn video nào. Bấm vào video ở trên để chọn.</span>`;
  $("add").disabled = !picked.size;
}
$("picked").onclick = e => { const p = e.target.dataset.p; if (p) { picked.delete(p); renderPicked(); browse(cur.dir); } };

$("add").onclick = async () => {
  const langs = [...document.querySelectorAll("input[name=lang]:checked")].map(i => i.value);
  try {
    const {ids} = await api("/jobs", {method: "POST", body: JSON.stringify({paths: [...picked], langs, tags: $("tags").checked})});
    $("msg").innerHTML = `<span class="ok">Đã thêm ${ids.length} job.</span>`;
    picked.clear(); renderPicked(); browse(cur.dir); poll();
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};

async function act(path, method, okMsg) {
  try { const r = await api(path, {method}); if (okMsg) $("msg").innerHTML = `<span class="ok">${esc(okMsg(r))}</span>`; }
  catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  poll();
}
window.retry = id => act(`/jobs/${id}/retry`, "POST");
window.remove = (id, running) => confirm(running
  ? "Job đang chạy. Dừng và xóa job này? (File phụ đề đã tạo vẫn giữ nguyên)"
  : "Xóa job này khỏi hàng đợi? (File phụ đề đã tạo vẫn giữ nguyên)") && act(`/jobs/${id}`, "DELETE");
window.pause = id => act(`/jobs/${id}/pause`, "POST");
window.resume = id => act(`/jobs/${id}/resume`, "POST");
window.mux = id => { $("msg").textContent = "Đang gắn phụ đề vào video…"; act(`/jobs/${id}/mux`, "POST", r => "Đã tạo: " + r.path); };

function timecode(s) {
  if (s == null) return "—";
  const whole = Math.max(0, Math.floor(s));
  return `${String(Math.floor(whole / 3600)).padStart(2, "0")}:${String(Math.floor(whole / 60) % 60).padStart(2, "0")}:${String(whole % 60).padStart(2, "0")}`;
}
function addressLines(address) {
  if (!address || typeof address !== "object") return "";
  return [["Nam tự xưng", address.male_self], ["Nam gọi nữ", address.male_to_female],
    ["Nữ tự xưng", address.female_self], ["Nữ gọi nam", address.female_to_male]]
    .filter(([, value]) => value).map(([label, value]) => `${label}: ${value}`).join(" · ");
}
function addressCards(addresses) {
  if (!Array.isArray(addresses) || !addresses.length) return "";
  return `<div class="brief-addresses">${addresses.map(a => {
    if (!a || typeof a !== "object") return "";
    const pair = [["Nam", a.male_self, a.male_to_female], ["Nữ", a.female_self, a.female_to_male]]
      .filter(([, self, to]) => self || to).map(([who, self, to]) => `${who}: ${self || "?"} → ${to || "?"}`).join(" · ");
    return `<span class="brief-address" title="${esc(a.between || "Cặp xưng hô")}">${esc(a.between || "Cặp xưng hô")}: ${esc(pair)}</span>`;
  }).join("")}</div>`;
}
function speakerChip(speaker, gender) {
  const labels = speaker ? speaker.split(/>|→/).map(s => s.trim()).filter(Boolean) : [({M: "nam", F: "nữ"}[gender] || "?")];
  return labels.map(label => {
    let hash = 0;
    for (const char of label) hash = (hash * 31 + char.codePointAt(0)) >>> 0;
    const hue = hash % 360;
    return `<span class="speaker-chip" title="${esc(label)}" style="color:hsl(${hue} 58% 47%);background:hsl(${hue} 72% 92% / .16)">${esc(label)}</span>`;
  }).join(" ");
}
function renderViewer() {
  const rows = $("lineFilter").checked ? viewerRows.filter(r => r.failed || r.polished) : viewerRows;
  $("lineRows").innerHTML = rows.length ? rows.map(r => {
    const marks = `${r.verified ? `<span class="badge" title="Ứng viên còn lại: ${esc(r.asr_alt || "")}" aria-label="Đã đối chiếu; ứng viên còn lại: ${esc(r.asr_alt || "n/a")}">Đã đối chiếu</span>` : ""}${r.polished ? '<span class="badge polished">Đã chỉnh</span>' : ""}${r.failed ? '<span class="badge failed">Lỗi dịch</span>' : ""}`;
    return `<tr><td>${timecode(r.start)}–${timecode(r.end)}</td><td>${speakerChip(r.speaker, r.gender)}</td><td>${esc(r.src || "")}</td><td>${esc(r.text || "—")}</td><td>${marks || "—"}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="muted">Không có dòng phù hợp bộ lọc.</td></tr>`;
}
async function refreshViewer(scrollIntoView = false) {
  if (!activeViewer) return;
  try {
    const scroll = document.querySelector(".table-scroll");
    const saved = scroll ? {left: scroll.scrollLeft, top: scroll.scrollTop, page: window.scrollY} : null;
    const data = await api(`/jobs/${activeViewer.id}/lines`);
    viewerRows = data.rows || [];
    const b = data.brief;
    $("brief").innerHTML = b && !b.skipped
      ? `<b>Tóm tắt bối cảnh</b><p>${esc(b.summary || "Không có mô tả.")}</p>${b.relationship ? `<p><b>Quan hệ:</b> ${esc(b.relationship)}</p>` : ""}${b.setting ? `<p><b>Bối cảnh:</b> ${esc(b.setting)}</p>` : ""}${addressLines(b.vi_address) ? `<p><b>Cách xưng hô:</b> ${esc(addressLines(b.vi_address))}</p>` : ""}${addressCards(b.addresses)}`
      : `<b>Không có tóm tắt bối cảnh</b>${b?.skipped ? `<p class="muted">${esc(b.skipped)}</p>` : ""}`;
    if (data.cloud_model) {
      $("brief").innerHTML += `<p class="muted" role="status" aria-atomic="true">Cloud fallback: ${Number(data.cloud_fallbacks) || 0} lượt (${esc(data.cloud_model)})</p>`;
    }
    $("viewerTitle").textContent = `Xem phụ đề · job ${activeViewer.id}`;
    $("translationLabel").textContent = `Bản dịch (${LANG[activeViewer.lang] || activeViewer.lang})`;
    $("viewer").hidden = false;
    renderViewer();
    if (saved) { scroll.scrollLeft = saved.left; scroll.scrollTop = saved.top; window.scrollTo(0, saved.page); }
    if (scrollIntoView) $("viewer").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
window.openViewer = async (id, lang) => {
  activeViewer = {id, lang, done: false};
  $("lineFilter").checked = false;
  await refreshViewer(true);
};
$("closeViewer").onclick = () => { $("viewer").hidden = true; activeViewer = null; };
$("lineFilter").onchange = renderViewer;

function renderSteps(activeStep, stepRows = [], hasError = false) {
  const active = Math.max(0, Math.min(stepInfo.length, Number(activeStep) || 0));
  const byName = new Map(stepRows.map(step => [step.name, step]));
  const items = stepInfo.map((stage, i) => {
    const completed = i < active, current = i === active, upcoming = i > active;
    const failed = current && hasError;
    const className = completed ? "is-complete" : failed ? "is-failed" : current ? "is-current" : upcoming ? "is-upcoming" : "";
    const detail = byName.get(stage.name) || {};
    const symbol = completed ? "✓" : String(i + 1);
    const meta = completed ? fmtDuration(detail.secs)
      : failed ? `Lỗi${detail.secs == null ? "" : ` · ${fmtDuration(detail.secs)}`}`
      : current ? `${fmtDuration(detail.secs)}${detail.progress == null ? "" : ` · ${Math.round(detail.progress * 100)}%`}`
      : "Chờ";
    const progress = current && detail.progress != null
      ? `<span class="step-progress" role="img" aria-label="Tiến độ ${Math.round(detail.progress * 100)} phần trăm"><i style="width:${Math.max(0, Math.min(100, Math.round(detail.progress * 100)))}%"></i></span>` : "";
    return `<li class="step-item ${className}"${current ? ' aria-current="step"' : ""}>
      <span class="step-head"><span class="step-icon" aria-hidden="true">${symbol}</span></span>
      <span class="step-label">${esc(stage.label_vi)}</span>
      <small class="step-meta">${meta}</small>${progress}
    </li>`;
  }).join("");
  return `<div class="steps-viewport"><ol class="step-strip" aria-label="Các bước xử lý">${items}</ol></div>`;
}

function activeStepFor(stage) {
  const activeName = {queued: "gate", gated: "asr", transcribed: "brief", briefed: "verify", verified: "translate",
    translated: "polish", polished: "retime"}[stage];
  return activeName ? Math.max(0, stepInfo.findIndex(step => step.name === activeName))
    : stage === "done" ? stepInfo.length : 0;
}

async function poll() {
  let rows;
  try { rows = await api("/jobs"); } catch { return; }
  const openErrors = new Set([...$("rows").querySelectorAll("details[open]")]
    .map(detail => detail.closest(".queue-card")?.dataset.job));
  if (activeViewer && !rows.some(j => j.id === activeViewer.id)) activeViewer = null;
  $("rows").innerHTML = rows.length ? rows.map(j => {
    const done = j.stage === "done";
    const activeStep = activeStepFor(j.stage);
    const running = !done && !j.error;
    const result = done ? `${j.cues ?? "?"} dòng${j.failed_lines ? `, <span class="bad">${j.failed_lines} lỗi</span>` : ""}` : "";
    if (activeViewer?.id === j.id) activeViewer.done = done;
    return `<tr class="queue-card" data-job="${j.id}">
      <td class="job-id">${j.id}</td>
      <td class="job-video"><span class="video" title="${esc(j.video)}">${esc(base(j.video))}</span></td>
      <td class="lang-cell"><span class="lang-tag">${esc(LANG[j.lang] || j.lang)}${j.cloud_model ? `<span class="cloud-icon" title="Dùng ${esc(j.cloud_model)} trên cloud; nội dung được gửi ra ngoài máy" aria-label="Dùng model cloud">☁</span>` : ""}</span></td>
      <td class="steps-cell">${renderSteps(activeStep, j.steps, Boolean(j.error))}</td>
      <td class="result-cell">${j.control === "delete" ? `<span class="muted">Đang xóa…</span>`
        : j.control === "pause" ? `<span class="muted">⏸ Đã tạm dừng</span>`
        : j.error ? ""
        : result || (!done ? (j.eta_s == null ? "" : `Còn ${fmt(j.eta_s)}`) : `<span class="ok">Xong</span>`)}</td>
      <td class="actions">
        ${j.stage !== "queued" ? `<button onclick="openViewer(${j.id}, '${esc(j.lang)}')">Xem phụ đề</button>` : ""}
        ${running && !j.control ? `<button onclick="pause(${j.id})" title="Dừng sau bước con hiện tại; tiếp tục được">⏸ Tạm dừng</button>` : ""}
        ${j.control === "pause" ? `<button onclick="resume(${j.id})">▶ Tiếp tục</button>` : ""}
        ${j.error ? `<button onclick="retry(${j.id})">Thử lại</button>` : ""}
        ${done ? `<button onclick="mux(${j.id})" title="Tạo .subs.mkv với tất cả phụ đề đã có">Gắn vào video</button>` : ""}
        ${j.control !== "delete" ? `<button onclick="remove(${j.id}, ${running})" title="Xóa khỏi hàng đợi">Xóa</button>` : ""}
      </td>${j.error ? `<td class="job-error"><details${openErrors.has(String(j.id)) ? " open" : ""}><summary>Lỗi: ${esc(j.error.slice(0, 110))}</summary><p>${esc(j.error)}</p></details></td>` : ""}</tr>`;
  }).join("") : `<tr><td colspan="6" class="muted">Chưa có job nào.</td></tr>`;
}

$("lineFilter").checked = false;
loadSteps(); doctor(); browse(); poll(); setInterval(poll, 2000);
setInterval(() => { if (activeViewer && !activeViewer.done && !$("viewer").hidden) refreshViewer(); }, 10000);
</script>
</body>
</html>
