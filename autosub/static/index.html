<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightsub</title>
<style>
  :root { --bg: #fafafa; --fg: #222; --muted: #777; --line: #ddd; --card: #fff; --acc: #2f6fde; --bad: #c0392b; --ok: #1e8449; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ddd; --muted: #999; --line: #333; --card: #1f1f1f; --acc: #6b9bf2; --bad: #e57368; --ok: #58c27d; } }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: auto; }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }
  h2 { font-size: 1rem; margin: 0 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; flex: 1; min-width: 16rem; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  #browser { max-height: 16rem; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin: .6rem 0; }
  #browser div { padding: .25rem .6rem; cursor: pointer; border-bottom: 1px solid var(--line); }
  #browser div:hover { background: var(--bg); }
  .chips span { display: inline-flex; gap: .3rem; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: .1rem .5rem; margin: .15rem; }
  .chips button { border: 0; padding: 0 .2rem; background: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); }
  .bar { width: 8rem; height: .5rem; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  td.video { max-width: 22rem; overflow-wrap: anywhere; }
  .actions { display: flex; gap: .3rem; flex-wrap: wrap; }
  button, summary { min-height: 44px; }
  button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  .steps-cell { min-width: 34rem; }
  .step-strip { display: grid; grid-template-columns: repeat(6, minmax(5rem, 1fr)); gap: .35rem; }
  .step { min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: .3rem .4rem; color: var(--muted); background: var(--bg); }
  .step-title { display: flex; gap: .25rem; align-items: center; font-size: .78rem; line-height: 1.25; }
  .step-meta { display: block; margin-top: .2rem; font-size: .7rem; white-space: nowrap; }
  .step.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok), var(--line) 55%); }
  .step.running { color: var(--fg); border-color: var(--acc); }
  .step.failed { color: var(--bad); border-color: var(--bad); }
  .step-progress { height: .25rem; margin-top: .3rem; background: var(--line); border-radius: 99px; overflow: hidden; }
  .step-progress i { display: block; height: 100%; background: var(--acc); }
  #stepLegend { margin-top: .7rem; }
  #stepLegend summary { cursor: pointer; }
  #stepLegend ul { margin: .35rem 0 0; padding-left: 1.2rem; }
  #viewer[hidden] { display: none; }
  .viewer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; }
  .brief { border: 1px solid var(--line); border-radius: 6px; padding: .7rem; margin: .6rem 0; }
  .brief p { margin: .2rem 0; }
  .table-scroll { overflow-x: auto; }
  table.vlines { min-width: 650px; }
  table.vlines td { vertical-align: top; overflow-wrap: anywhere; }
  .badge { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: .05rem .4rem; margin: .1rem; white-space: nowrap; font-size: .75rem; }
  .badge.polished { color: var(--ok); border-color: var(--ok); }
  .badge.failed { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 760px) {
    body { padding: .75rem; }
    .steps-cell { min-width: 0; }
    .step-strip { grid-template-columns: repeat(3, minmax(5.2rem, 1fr)); }
    #rows tr { display: grid; grid-template-columns: min-content minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    #rows td { border: 0; padding: .35rem; }
    #rows td:nth-child(2) { grid-column: 2; }
    #rows td:nth-child(3) { grid-column: 1; }
    #rows td:nth-child(4), #rows td:nth-child(5), #rows td:nth-child(6) { grid-column: 1 / -1; }
    .actions { gap: .5rem; }
  }
</style>
</head>
<body>
<main>
<h1>nightsub</h1>

<div class="card" id="doctor"><span class="muted">Đang kiểm tra hệ thống…</span></div>

<div class="card">
  <h2>Thêm video</h2>
  <div class="row">
    <button id="up" title="Thư mục cha">↑</button>
    <input type="text" id="dir" aria-label="Thư mục">
    <button id="go">Mở</button>
    <button id="addDir">Chọn cả thư mục này</button>
  </div>
  <div id="browser"></div>
  <div class="chips" id="picked"><span class="muted">Chưa chọn video nào. Bấm vào video ở trên để chọn.</span></div>
  <div class="row" style="margin-top:.6rem">
    <label><input type="checkbox" name="lang" value="en" checked> Tiếng Anh</label>
    <label><input type="checkbox" name="lang" value="vi" checked> Tiếng Việt</label>
    <label title="Hiện [rên], [nhạc]… ở các đoạn không có lời thoại"><input type="checkbox" id="tags"> Ghi chú âm thanh</label>
    <button class="primary" id="add" disabled>Bắt đầu</button>
    <span id="msg" role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
  <details id="stepLegend">
    <summary>Các bước xử lý</summary>
    <ul id="stepHelp"><li class="muted">Đang tải các bước…</li></ul>
  </details>
</div>

<div class="card">
  <h2>Hàng đợi</h2>
  <table>
    <thead><tr><th>#</th><th>Video</th><th>Ngôn ngữ</th><th>Các bước</th><th>Kết quả</th><th>Thao tác</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="muted">Chưa có job nào.</td></tr></tbody>
  </table>
</div>

<section class="card" id="viewer" hidden aria-labelledby="viewerTitle">
  <div class="viewer-head">
    <div><h2 id="viewerTitle">Xem phụ đề</h2><div id="brief" class="brief"></div></div>
    <button id="closeViewer" aria-label="Đóng trình xem phụ đề">Đóng</button>
  </div>
  <label><input type="checkbox" id="lineFilter"> Chỉ dòng lỗi/đã chỉnh</label>
  <div class="table-scroll">
    <table class="vlines">
      <thead><tr><th>Thời gian</th><th>Giọng</th><th>日本語</th><th id="translationLabel">Bản dịch</th><th>Trạng thái</th></tr></thead>
      <tbody id="lineRows"></tbody>
    </table>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base = p => p.split("/").pop();
const fmt = s => s == null ? "—" : s < 60 ? "<1 phút" : `${Math.floor(s / 3600) ? Math.floor(s / 3600) + " giờ " : ""}${Math.floor(s / 60) % 60} phút`;
const fmtDuration = s => s == null ? "—" : s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
const LANG = {en: "Anh", vi: "Việt"};
const picked = new Set();
let stepInfo = [], viewerRows = [];

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function doctor() {
  try {
    const {problems} = await api("/doctor");
    $("doctor").innerHTML = problems.length
      ? `<b class="bad">Chưa sẵn sàng:</b><ul>${problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`
      : `<span class="ok">✓ Hệ thống sẵn sàng (GPU, ffmpeg, ollama, model)</span>`;
  } catch (e) { $("doctor").innerHTML = `<span class="bad">Không kiểm tra được: ${esc(e.message)}</span>`; }
}

async function loadSteps() {
  try {
    stepInfo = await api("/steps");
    $("stepHelp").innerHTML = stepInfo.map(s => `<li><b>${esc(s.label_vi)}</b>: ${esc(s.help_vi)}</li>`).join("");
  } catch (e) { $("stepHelp").innerHTML = `<li class="bad">Không tải được danh sách bước: ${esc(e.message)}</li>`; }
}

let cur = null;
async function browse(dir) {
  try {
    const b = await api(`/browse${dir ? "?dir=" + encodeURIComponent(dir) : ""}`);
    cur = b; $("dir").value = b.dir;
    $("browser").innerHTML = [
      ...b.dirs.map(d => `<div data-dir="${esc(d)}">📁 ${esc(d)}</div>`),
      ...b.videos.map(v => `<div data-video="${esc(v)}">${picked.has(b.dir + "/" + v) ? "☑" : "☐"} 🎬 ${esc(v)}</div>`),
    ].join("") || `<div class="muted">Thư mục trống</div>`;
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
$("browser").onclick = e => {
  const el = e.target.closest("div"); if (!el) return;
  if (el.dataset.dir) return browse(cur.dir + "/" + el.dataset.dir);
  if (el.dataset.video) { const p = cur.dir + "/" + el.dataset.video; picked.has(p) ? picked.delete(p) : picked.add(p); renderPicked(); browse(cur.dir); }
};
$("up").onclick = () => browse(cur.parent);
$("go").onclick = () => browse($("dir").value);
$("dir").onkeydown = e => { if (e.key === "Enter") browse($("dir").value); };
$("addDir").onclick = () => { picked.add(cur.dir); renderPicked(); };

function renderPicked() {
  $("picked").innerHTML = picked.size
    ? [...picked].map(p => `<span>${esc(base(p) || p)}<button data-p="${esc(p)}" title="Bỏ chọn">✕</button></span>`).join("")
    : `<span class="muted">Chưa chọn video nào. Bấm vào video ở trên để chọn.</span>`;
  $("add").disabled = !picked.size;
}
$("picked").onclick = e => { const p = e.target.dataset.p; if (p) { picked.delete(p); renderPicked(); browse(cur.dir); } };

$("add").onclick = async () => {
  const langs = [...document.querySelectorAll("input[name=lang]:checked")].map(i => i.value);
  try {
    const {ids} = await api("/jobs", {method: "POST", body: JSON.stringify({paths: [...picked], langs, tags: $("tags").checked})});
    $("msg").innerHTML = `<span class="ok">Đã thêm ${ids.length} job.</span>`;
    picked.clear(); renderPicked(); browse(cur.dir); poll();
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};

async function act(path, method, okMsg) {
  try { const r = await api(path, {method}); if (okMsg) $("msg").innerHTML = `<span class="ok">${esc(okMsg(r))}</span>`; }
  catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  poll();
}
window.retry = id => act(`/jobs/${id}/retry`, "POST");
window.remove = id => confirm("Xóa job này khỏi hàng đợi? (File phụ đề đã tạo vẫn giữ nguyên)") && act(`/jobs/${id}`, "DELETE");
window.mux = id => { $("msg").textContent = "Đang gắn phụ đề vào video…"; act(`/jobs/${id}/mux`, "POST", r => "Đã tạo: " + r.path); };

function timecode(s) {
  if (s == null) return "—";
  const whole = Math.max(0, Math.floor(s));
  return `${String(Math.floor(whole / 3600)).padStart(2, "0")}:${String(Math.floor(whole / 60) % 60).padStart(2, "0")}:${String(whole % 60).padStart(2, "0")}`;
}
function addressLines(address) {
  if (!address || typeof address !== "object") return "";
  return [["Nam tự xưng", address.male_self], ["Nam gọi nữ", address.male_to_female],
    ["Nữ tự xưng", address.female_self], ["Nữ gọi nam", address.female_to_male]]
    .filter(([, value]) => value).map(([label, value]) => `${label}: ${value}`).join(" · ");
}
function renderViewer() {
  const rows = $("lineFilter").checked ? viewerRows.filter(r => r.failed || r.polished) : viewerRows;
  $("lineRows").innerHTML = rows.length ? rows.map(r => {
    const gender = {M: "nam", F: "nữ"}[r.gender] || "?";
    const marks = `${r.polished ? '<span class="badge polished">Đã chỉnh</span>' : ""}${r.failed ? '<span class="badge failed">Lỗi dịch</span>' : ""}`;
    return `<tr><td>${timecode(r.start)}–${timecode(r.end)}</td><td>${gender}</td><td>${esc(r.src || "")}</td><td>${esc(r.text || "—")}</td><td>${marks || "—"}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="muted">Không có dòng phù hợp bộ lọc.</td></tr>`;
}
window.openViewer = async (id, lang) => {
  try {
    const data = await api(`/jobs/${id}/lines`);
    viewerRows = data.rows || [];
    const b = data.brief;
    $("brief").innerHTML = b && !b.skipped
      ? `<b>Tóm tắt bối cảnh</b><p>${esc(b.summary || "Không có mô tả.")}</p>${b.relationship ? `<p><b>Quan hệ:</b> ${esc(b.relationship)}</p>` : ""}${b.setting ? `<p><b>Bối cảnh:</b> ${esc(b.setting)}</p>` : ""}${addressLines(b.vi_address) ? `<p><b>Cách xưng hô:</b> ${esc(addressLines(b.vi_address))}</p>` : ""}`
      : `<b>Không có tóm tắt bối cảnh</b>${b?.skipped ? `<p class="muted">${esc(b.skipped)}</p>` : ""}`;
    $("viewerTitle").textContent = `Xem phụ đề · job ${id}`;
    $("translationLabel").textContent = `Bản dịch (${LANG[lang] || lang})`;
    $("lineFilter").checked = false;
    $("viewer").hidden = false;
    renderViewer();
    $("viewer").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};
$("closeViewer").onclick = () => { $("viewer").hidden = true; };
$("lineFilter").onchange = renderViewer;

function renderSteps(steps, error) {
  return `<div class="step-strip" role="list">${(steps || []).map(step => {
    const info = stepInfo.find(s => s.name === step.name) || {label_vi: step.name};
    const icon = {done: "✓", running: "●", pending: "○", failed: "!"}[step.state] || "○";
    const meta = step.state === "done" ? fmtDuration(step.secs)
      : step.state === "running" ? `${fmtDuration(step.secs)}${step.progress == null ? "" : ` · ${Math.round(step.progress * 100)}%`}`
      : step.state === "failed" ? "Lỗi" : "Chờ";
    const progress = step.state === "running" ? `<div class="step-progress" aria-label="Tiến độ bước"><i style="width:${Math.max(0, Math.min(100, Math.round((step.progress || 0) * 100)))}%"></i></div>` : "";
    return `<div class="step ${esc(step.state)}" role="listitem" title="${step.state === "failed" ? esc(error || "Bước thất bại") : esc(info.help_vi || info.label_vi)}"><span class="step-title"><span aria-hidden="true">${icon}</span>${esc(info.label_vi)}</span><small class="step-meta">${meta}</small>${progress}</div>`;
  }).join("")}</div>`;
}

async function poll() {
  let rows;
  try { rows = await api("/jobs"); } catch { return; }
  $("rows").innerHTML = rows.length ? rows.map(j => {
    const done = j.stage === "done";
    const result = done ? `${j.cues ?? "?"} dòng${j.failed_lines ? `, <span class="bad">${j.failed_lines} lỗi</span>` : ""}` : "";
    return `<tr>
      <td>${j.id}</td>
      <td class="video" title="${esc(j.video)}">${esc(base(j.video))}</td>
      <td>${esc(LANG[j.lang] || j.lang)}</td>
      <td class="steps-cell">${renderSteps(j.steps, j.error)}</td>
      <td>${j.error ? `<span class="bad" title="${esc(j.error)}">Lỗi: ${esc(j.error.slice(0, 80))}</span>` : result || (!done ? `Còn ${fmt(j.eta_s)}` : `<span class="ok">Xong</span>`)}</td>
      <td class="actions">
        ${j.stage !== "queued" ? `<button onclick="openViewer(${j.id}, '${esc(j.lang)}')">Xem phụ đề</button>` : ""}
        ${j.error ? `<button onclick="retry(${j.id})">Thử lại</button>` : ""}
        ${done ? `<button onclick="mux(${j.id})" title="Tạo .subs.mkv với tất cả phụ đề đã có">Gắn vào video</button>` : ""}
        ${done || j.error ? `<button onclick="remove(${j.id})" title="Xóa khỏi hàng đợi">Xóa</button>` : ""}
      </td></tr>`;
  }).join("") : `<tr><td colspan="6" class="muted">Chưa có job nào.</td></tr>`;
}

$("lineFilter").checked = false;
loadSteps(); doctor(); browse(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
